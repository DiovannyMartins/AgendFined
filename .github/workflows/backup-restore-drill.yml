name: Isolated encrypted backup restore drill

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

defaults:
  run:
    # -e: stop on any failing command; -u: fail on unset variables;
    # -o pipefail: a failing command inside a pipeline fails the step.
    shell: bash -euo pipefail {0}

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Download latest successful encrypted backup
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only artifacts produced by the backup workflow itself (schedule or
          # manual dispatch), in this same repository, from a commit that is
          # part of the default branch, are trusted.
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          candidates=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/database-backup.yml/runs?branch=$default_branch&status=success&per_page=50" \
            | jq -r --arg repo "$GITHUB_REPOSITORY" '
              .workflow_runs[]
              | select(.event == "schedule" or .event == "workflow_dispatch")
              | select(.repository.full_name == $repo and .head_repository.full_name == $repo)
              | select(.path == ".github/workflows/database-backup.yml")
              | "\(.id) \(.head_sha)"')
          run_id=""
          while read -r candidate_id candidate_sha; do
            [[ "$candidate_id" =~ ^[0-9]+$ && "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            # "identical" or "ahead": the run's commit is reachable from the default branch.
            relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$candidate_sha...$default_branch" --jq .status || true)
            if [ "$relation" = "identical" ] || [ "$relation" = "ahead" ]; then
              run_id="$candidate_id"
              break
            fi
          done <<< "$candidates"
          if [ -z "$run_id" ]; then
            echo "::error::Nenhum backup confiável encontrado no branch padrão."
            exit 1
          fi
          mkdir -p backup
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "agendfined-db-$run_id" --dir backup
          # File names derive from the trusted run id, never from the artifact,
          # and the artifact must contain exactly these two regular files.
          public_backup="backup/agendfined-$run_id.sql.gz.aes256gcm"
          auth_backup="backup/agendfined-auth-$run_id.sql.gz.aes256gcm"
          for file in "$public_backup" "$auth_backup"; do
            [[ "$file" =~ ^backup/[A-Za-z0-9._/-]+$ ]] || { echo "::error::Nome de backup inválido"; exit 1; }
            [[ -f "$file" && ! -L "$file" ]] || { echo "::error::Arquivo de backup ausente"; exit 1; }
          done
          entries=$(find backup -mindepth 1 -printf x | wc -c)
          [ "$entries" -eq 2 ] || { echo "::error::Artefato com conteúdo inesperado"; exit 1; }
          {
            echo "public_backup=$public_backup"
            echo "auth_backup=$auth_backup"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare disposable Supabase project
        run: |
          mkdir -p restore-project
          cp -R supabase restore-project/
          sed -i 's/project_id = "projeto"/project_id = "af-restore-ci"/' restore-project/supabase/config.toml

      - name: Start isolated database and apply migrations
        run: |
          npx --yes supabase@2.116.0 start \
            --workdir restore-project \
            --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            --yes
          npx --yes supabase@2.116.0 db reset --local --workdir restore-project --no-seed --yes

      - name: Restore public and Auth dumps into isolated database
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          PUBLIC_BACKUP: ${{ steps.download.outputs.public_backup }}
          AUTH_BACKUP: ${{ steps.download.outputs.auth_backup }}
        run: |
          for file in "$PUBLIC_BACKUP" "$AUTH_BACKUP"; do
            [[ "$file" =~ ^backup/[A-Za-z0-9._/-]+$ ]] || { echo "::error::Nome de backup inválido"; exit 1; }
          done
          node scripts/backup/restore-to-local-docker.mjs "$PUBLIC_BACKUP" supabase_db_af-restore-ci public
          node scripts/backup/restore-to-local-docker.mjs "$AUTH_BACKUP" supabase_db_af-restore-ci auth

      - name: Verify restored data, constraints and RLS
        run: |
          counts=$(docker exec supabase_db_af-restore-ci psql -U supabase_admin -d postgres -Atc \
            "select (select count(*) from public.businesses), (select count(*) from public.bookings), (select count(*) from public.customers), (select count(*) from auth.users);")
          IFS='|' read -r businesses bookings customers users <<< "$counts"
          for value in "$businesses" "$bookings" "$customers" "$users"; do
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "::error::Contagem restaurada vazia ou inválida"; exit 1; }
          done
          test "${businesses:-0}" -gt 0
          test "${bookings:-0}" -gt 0
          test "${customers:-0}" -gt 0
          # The Auth dump must restore at least one user.
          test "${users:-0}" -gt 0
          rls_missing=$(docker exec supabase_db_af-restore-ci psql -U supabase_admin -d postgres -Atc \
            "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r' and not c.relrowsecurity;")
          [[ "$rls_missing" =~ ^[0-9]+$ ]] || { echo "::error::Consulta de RLS sem resultado"; exit 1; }
          test "$rls_missing" = "0"
          fk_count=$(docker exec supabase_db_af-restore-ci psql -U supabase_admin -d postgres -Atc \
            "select count(*) from pg_constraint where contype = 'f' and connamespace = 'public'::regnamespace;")
          [[ "$fk_count" =~ ^[0-9]+$ ]] || { echo "::error::Consulta de FKs sem resultado"; exit 1; }
          test "$fk_count" -gt 0
          echo "Restored counts businesses|bookings|customers|auth.users: $counts"
          echo "RLS-disabled public tables: $rls_missing"
          echo "Public foreign keys checked: $fk_count"

      - name: Stop isolated database
        if: always()
        run: npx --yes supabase@2.116.0 stop --workdir restore-project --no-backup
