name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # LayoutProps and route types come from Next's generated .next/types.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The migrations rely on the cloud default that grants new public tables to
      # the Data API roles; config.toml opts out, so a fresh stack would deny
      # service_role on every table.
      - name: Match the cloud table grants
        run: sed -i 's/^auto_expose_new_tables = false$/auto_expose_new_tables = true/' supabase/config.toml && grep -q '^auto_expose_new_tables = true$' supabase/config.toml
      # Applies supabase/migrations and seed.sql; the suite needs only db, auth,
      # PostgREST and the gateway.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api
      - run: npm run test:integration:local
