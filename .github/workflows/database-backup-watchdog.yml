name: Check Supabase backup freshness

on:
  schedule:
    - cron: "43 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  actions: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if no successful backup started in 18 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only scheduled or manually dispatched runs of the backup workflow,
          # on the default branch of this same repository, count as fresh.
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          latest=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/database-backup.yml/runs?branch=$default_branch&status=success&per_page=50" \
            | jq -r --arg repo "$GITHUB_REPOSITORY" '
              [.workflow_runs[]
                | select(.event == "schedule" or .event == "workflow_dispatch")
                | select(.repository.full_name == $repo and .head_repository.full_name == $repo)
                | select(.path == ".github/workflows/database-backup.yml")
                | .created_at]
              | max // empty')

          if [ -z "$latest" ]; then
            echo "::error::No successful encrypted database backup found."
            exit 1
          fi

          age_seconds=$(( $(date -u +%s) - $(date -u -d "$latest" +%s) ))
          echo "Latest successful backup started at $latest ($(( age_seconds / 3600 )) hours ago)."

          if [ "$age_seconds" -gt 64800 ]; then
            echo "::error::Latest successful backup is older than 18 hours. Check the backup workflow and artifact."
            exit 1
          fi
