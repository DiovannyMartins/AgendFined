name: Encrypted Supabase database backup

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify backup secrets
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          test -n "$SUPABASE_BACKUP_DB_URL"
          test "${#BACKUP_ENCRYPTION_KEY}" -eq 64
      - name: Stream database dump into AES-256-GCM
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          mkdir -p backup
          node scripts/backup/encrypt-command.mjs "backup/agendfined-${GITHUB_RUN_ID}.sql.gz.aes256gcm" -- \
            docker run --rm -e SUPABASE_BACKUP_DB_URL \
            public.ecr.aws/supabase/postgres:17.6.1.166 \
            sh -c 'exec pg_dump --dbname="$SUPABASE_BACKUP_DB_URL" --data-only --no-owner --no-privileges --schema=public'
          node scripts/backup/decrypt-file.mjs "backup/agendfined-${GITHUB_RUN_ID}.sql.gz.aes256gcm" --verify
      - name: Stream Auth accounts into AES-256-GCM
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          node scripts/backup/encrypt-command.mjs "backup/agendfined-auth-${GITHUB_RUN_ID}.sql.gz.aes256gcm" -- \
            docker run --rm -e SUPABASE_BACKUP_DB_URL \
            -e PGOPTIONS='-c default_transaction_read_only=on' \
            public.ecr.aws/supabase/postgres:17.6.1.166 \
            sh -c 'exec psql "$SUPABASE_BACKUP_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select * from backup_internal.export_auth_sql()"'
          node scripts/backup/decrypt-file.mjs "backup/agendfined-auth-${GITHUB_RUN_ID}.sql.gz.aes256gcm" --verify
      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: agendfined-db-${{ github.run_id }}
          path: backup/*.aes256gcm
          if-no-files-found: error
          retention-days: 30
