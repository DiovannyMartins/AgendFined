name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # LayoutProps and route types come from Next's generated .next/types.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Same service versions as the linked production project (supabase/.temp,
      # gitignored). The CLI defaults start a newer stack whose fresh database
      # does not grant the public tables to service_role.
      - name: Pin Supabase service versions
        run: |
          mkdir -p supabase/.temp
          echo "17.6.1.166" > supabase/.temp/postgres-version
          echo "v2.195.0" > supabase/.temp/gotrue-version
          echo "v14.5" > supabase/.temp/rest-version
      # Applies supabase/migrations and seed.sql; the suite needs only db, auth,
      # PostgREST and the gateway.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api
      - run: npm run test:integration:local
